stryker4s {
  # Relative to the application subproject's base-dir, not the repo root. Excludes poc/** -
  # unrelated PoC/demo code (Kafka producer/consumer demos, banking domain PoC, ZIO layer/loop
  # demos) with no test coverage by design, which would otherwise dilute the mutation score.
  mutate = ["src/main/scala/**/*.scala", "!src/main/scala/com/cmartin/utils/poc/**"]

  reporters = ["console", "html"]

  # Default (5s) times out on the initial baseline run before per-test timings exist -
  # cold JVM start plus the full suite easily exceeds it.
  timeout = 60 seconds

  # Capped to 1: a forked runner per mutant times .jvmopts' -Xmx4096m at the default concurrency (3)
  # could demand ~12GB of heap in parallel, tight against CI's 16GB runner. Correctness over speed
  # for a report-only job.
  concurrency = 1
  # The default runner reports every mutant as NoCoverage (its per-test coverage collection never
  # matches mutants to ScalaTest tests here, even with Test/fork off); the legacy runner (a forked
  # sbt per mutant) yields real kill/survive results. See CLAUDE.md's "Mutation testing" section.
  legacy-test-runner = true

  thresholds {
    high  = 80
    low   = 60
    break = 0   # report-only until a baseline mutation score exists
  }
}
