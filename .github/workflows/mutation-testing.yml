name: Mutation Testing

on:
  schedule:
    - cron: '0 15 * * 5'  # every Friday at 15:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stryker:

    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
      - name: Setup JDK
        uses: ./.github/actions/setup-jdk
      - uses: sbt/setup-sbt@v1
      - name: Mutation testing (Stryker4s)
        # Concurrency is capped in stryker4s.conf (`concurrency = 1`), not via a CLI flag: the sbt
        # plugin has no CLI options, so `sbt application/stryker --concurrency 1` made sbt parse
        # `--concurrency` as its own command and fail with "Not a valid command: --".
        #
        # set -o pipefail is required: GitHub's default `bash -e {0}` does NOT enable pipefail, so
        # without it this step's exit code comes from `tee` (always 0), silently masking a real
        # `sbt application/stryker` failure behind a green checkmark - confirmed happened on the
        # first run of this workflow (2026-07-24).
        #
        # DL_FILENAME/DL_EXCLUSIONS must be set here too, matching build.sbt's `Test / envVars`:
        # sbt-stryker4s forks its own test-runner JVMs outside sbt's normal Test/fork machinery, so
        # they inherit only the ambient process environment, never sbt's Test/envVars overlay.
        # Without these, FileManagerSpec's "should read system property" test fails for real in
        # Stryker's fork (confirmed root cause of the long-standing InitialTestRunFailedException;
        # see CLAUDE.md's "Mutation testing (Stryker4s)" section).
        env:
          DL_FILENAME: /tmp/dep-list.log
          DL_EXCLUSIONS: "com.cmartin.learn, com.cmartin.poc"
        run: |
          set -o pipefail
          sbt application/stryker | tee stryker-output.log
      - name: Report mutation score
        if: always()
        run: |
          {
            echo '## Mutation testing (Stryker4s)'
            echo '```'
            grep -E 'Mutation score|threshold' stryker-output.log || echo 'No score line found - see the full log or the uploaded report.'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stryker4s-report
          path: application/target/stryker4s-report/**
          retention-days: 90
