name: CI

on:
  push:
    branches:
      - 'main'
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - '**.puml'
      - '**.graphml'
  pull_request:
    types: [ opened ]

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - name: Setup JDK
        uses: ./.github/actions/setup-jdk
      - uses: sbt/setup-sbt@v1
      # Each step reuses one sbt server through --client, instead of starting a new JVM. xcoverage
      # leaves coverage on in that server, so assembly must run first or the jars get instrumented.
      - name: compile
        run: sbt -v --client compile
      - name: formatting
        run: sbt -v --client scalafmtCheckAll
      - name: assembly
        run: sbt -v --client assembly
      - name: tests with coverage
        run: sbt -v --client xcoverage
      - name: upload coverage reports to codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
